# MondLED – ESPHome configuration for the ESP32-C3 Super Mini (USB-C)
#
# Modern alternative to the ESP8266 / Arduino firmware in this repository.
# The lamp shows up in Home Assistant automatically (native API, no HTTP calls needed).
#
# Setup:
#   1. Copy "secrets.yaml.example" to "secrets.yaml" and fill in your values.
#   2. Flash the first time via USB-C:  esphome run mondled.yaml
#   3. Later updates work over the air (OTA).

substitutions:
  name: mondled
  friendly_name: MondLED
  led_pin: GPIO3     # data pin -> 470 Ohm resistor -> DIN of the LED strip
  num_leds: "15"     # number of LEDs in your strip

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Many ESP32-C3 Super Mini boards have a poorly matched antenna. If the board
  # sees the network but fails with "Auth Expired" / "Association Expired",
  # lowering the transmit power usually fixes it (try 8.5dB, then 10dB / 5dB).
  output_power: 8.5dB
  power_save_mode: none

  # Fallback hotspot in case the WiFi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    name: "Mond LED"
    chipset: WS2812
    rgb_order: GRB
    pin: ${led_pin}
    num_leds: ${num_leds}
    # Restores the last state after a power loss (like the EEPROM in the Arduino firmware).
    # Use RESTORE_DEFAULT_OFF to start switched off when no state is stored yet.
    restore_mode: RESTORE_DEFAULT_OFF
